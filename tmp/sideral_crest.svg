<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08142c" />
      <stop offset="50%" stop-color="#0c2048" />
      <stop offset="100%" stop-color="#050c1c" />
    </linearGradient>

    <linearGradient id="outerSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#a6c0e2" />
      <stop offset="50%" stop-color="#5577a8" />
      <stop offset="75%" stop-color="#d4e3f7" />
      <stop offset="100%" stop-color="#7698c7" />
    </linearGradient>

    <linearGradient id="shieldNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142b5c" />
      <stop offset="50%" stop-color="#0c1d42" />
      <stop offset="100%" stop-color="#07122b" />
    </linearGradient>

    <linearGradient id="innerSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#9bb7dc" />
      <stop offset="100%" stop-color="#5575a5" />
    </linearGradient>

    <linearGradient id="bannerRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f03844" />
      <stop offset="45%" stop-color="#d61d28" />
      <stop offset="70%" stop-color="#b5121c" />
      <stop offset="100%" stop-color="#7e0810" />
    </linearGradient>

    <linearGradient id="bannerBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#90b2dc" />
      <stop offset="100%" stop-color="#496c9c" />
    </linearGradient>

    <linearGradient id="metalText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f5f7fa" />
      <stop offset="70%" stop-color="#ccd8e8" />
      <stop offset="100%" stop-color="#98aeca" />
    </linearGradient>

    <linearGradient id="upperWhiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#eaf0f8" />
      <stop offset="100%" stop-color="#d5e1f0" />
    </linearGradient>

    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="bannerShadow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#030814" flood-opacity="0.75" />
    </filter>

    <!-- Shield Clipping Paths -->
    <clipPath id="shieldInnerClip">
      <path d="M 250,30 L 430,85 C 430,85 440,240 395,330 C 350,420 250,470 250,470 C 250,470 150,420 105,330 C 60,240 70,85 70,85 Z" />
    </clipPath>

    <clipPath id="lowerShieldClip">
      <path d="M 50,180 L 450,180 L 450,480 L 50,480 Z" />
    </clipPath>
  </defs>

  <!-- Background decorative net / glow (subtle) -->
  <rect width="500" height="500" fill="url(#bgGlow)" rx="36" />
  <g stroke="#1a366b" stroke-width="1.2" opacity="0.35">
    <path d="M 0,50 L 500,200 M 0,150 L 500,300 M 0,250 L 500,400 M 0,350 L 500,500" />
    <path d="M 0,500 L 500,350 M 0,400 L 500,250 M 0,300 L 500,150 M 0,200 L 500,50" />
  </g>

  <!-- Main Shield Outer Shape with drop shadow -->
  <g filter="url(#shieldShadow)">
    <!-- Outer Chrome Bevel -->
    <path d="M 250,22 L 442,80 C 442,80 452,245 405,340 C 358,435 250,488 250,488 C 250,488 142,435 95,340 C 48,245 58,80 58,80 Z"
          fill="url(#outerSilver)" />

    <!-- Navy Channel -->
    <path d="M 250,28 L 434,84 C 434,84 444,242 398,333 C 353,425 250,478 250,478 C 250,478 147,425 102,333 C 56,242 66,84 66,84 Z"
          fill="url(#shieldNavy)" />

    <!-- Inner Silver Ridge -->
    <path d="M 250,33 L 426,88 C 426,88 435,238 392,328 C 348,417 250,468 250,468 C 250,468 152,417 108,328 C 65,238 74,88 74,88 Z"
          fill="url(#innerSilver)" />

    <!-- Shield Interior Canvas (clipped) -->
    <g clip-path="url(#shieldInnerClip)">
      <!-- Top Half Background -->
      <path d="M 70,30 L 430,30 L 430,220 L 70,220 Z" fill="url(#upperWhiteGrad)" />

      <!-- Lower Half Vertical Stripes (Red and White) -->
      <g clip-path="url(#lowerShieldClip)">
        <rect x="70" y="170" width="360" height="310" fill="#ffffff" />
        <!-- Red Stripes -->
        <rect x="70" y="170" width="40" height="310" fill="#d61d28" />
        <rect x="140" y="170" width="35" height="310" fill="#d61d28" />
        <rect x="205" y="170" width="35" height="310" fill="#d61d28" />
        <rect x="270" y="170" width="35" height="310" fill="#d61d28" />
        <rect x="335" y="170" width="35" height="310" fill="#d61d28" />
        <rect x="400" y="170" width="40" height="310" fill="#d61d28" />
      </g>

      <!-- Three Red Stars at the top -->
      <!-- Center Star -->
      <polygon points="250,52 254,64 267,64 256,72 260,84 250,76 240,84 244,72 233,64 246,64"
               fill="#d61d28" stroke="#ffffff" stroke-width="0.8" />
      <!-- Left Star -->
      <polygon points="218,60 221,70 231,70 223,76 226,86 218,80 210,86 213,76 205,70 215,70"
               fill="#d61d28" stroke="#ffffff" stroke-width="0.8" />
      <!-- Right Star -->
      <polygon points="282,60 285,70 295,70 287,76 290,86 282,80 274,86 277,76 269,70 279,70"
               fill="#d61d28" stroke="#ffffff" stroke-width="0.8" />

      <!-- Text: SITUAÇÕES -->
      <text x="250" y="118"
            font-family="'Impact', 'Arial Black', sans-serif"
            font-size="34"
            font-weight="900"
            letter-spacing="4"
            text-anchor="middle"
            fill="#0c1d42">SITUAÇÕES</text>

      <!-- Lower Half Center Illustration: Medallion with Fan & Soda Bottle -->
      <g transform="translate(0, 30)">
        <!-- Emblema / Círculo Central com Sombra -->
        <circle cx="250" cy="275" r="76" fill="#0d1e44" stroke="#ffffff" stroke-width="5" />
        <circle cx="250" cy="275" r="70" fill="#f4f7fb" />

        <!-- Ventilador (Desk Fan) -->
        <g transform="translate(210, 260)">
          <!-- Fan Base & Stand -->
          <ellipse cx="0" cy="42" rx="26" ry="7" fill="#d61d28" stroke="#8c0e16" stroke-width="2" />
          <path d="M -7,40 L -4,22 L 4,22 L 7,40 Z" fill="#d61d28" stroke="#8c0e16" stroke-width="1.5" />
          <!-- Fan Outer Grill -->
          <circle cx="0" cy="0" r="32" fill="#ffffff" stroke="#d61d28" stroke-width="4.5" />
          <circle cx="0" cy="0" r="26" fill="none" stroke="#d61d28" stroke-width="1.8" />
          <circle cx="0" cy="0" r="18" fill="none" stroke="#d61d28" stroke-width="1.8" />
          <!-- Blades (Hélices vermelhas) -->
          <path d="M 0,0 C -12,-8 -16,-20 0,-24 C 6,-18 6,-8 0,0 Z" fill="#d61d28" />
          <path d="M 0,0 C 8,-12 20,-16 24,0 C 18,6 8,6 0,0 Z" fill="#d61d28" />
          <path d="M 0,0 C 12,8 16,20 0,24 C -6,18 -6,8 0,0 Z" fill="#d61d28" />
          <path d="M 0,0 C -8,12 -20,16 -24,0 C -18,-6 -8,-6 0,0 Z" fill="#d61d28" />
          <!-- Center Cap -->
          <circle cx="0" cy="0" r="7" fill="#ffffff" stroke="#d61d28" stroke-width="2.5" />
        </g>

        <!-- Garrafa de Refrigerante (Coca / Soda Bottle) -->
        <g transform="translate(278, 258)">
          <!-- Bottle Silhouette -->
          <!-- Cap -->
          <rect x="-4" y="-36" width="8" height="5" rx="1.5" fill="#d61d28" stroke="#8c0e16" stroke-width="1" />
          <!-- Neck & Body -->
          <path d="M -3,-31 C -3,-24 -7,-16 -8,-6 C -9,2 -9,24 -8,38 C -7,42 7,42 8,38 C 9,24 9,2 8,-6 C 7,-16 3,-24 3,-31 Z"
                fill="#ffffff" stroke="#d61d28" stroke-width="3.5" />
          <!-- Liquid Fill Inside -->
          <path d="M -6,-2 C -7,8 -7,22 -6,36 C -5,39 5,39 6,36 C 7,22 7,8 6,-2 Z"
                fill="#d61d28" />
          <!-- Label -->
          <rect x="-8" y="6" width="16" height="12" fill="#ffffff" stroke="#d61d28" stroke-width="1.5" />
          <line x1="-5" y1="12" x2="5" y2="12" stroke="#d61d28" stroke-width="2" />
        </g>

        <!-- Bola de Futebol (Soccer Ball) no vértice inferior -->
        <g transform="translate(250, 395)">
          <!-- Ball base -->
          <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#0c1d42" stroke-width="4.5" />
          <!-- Pentágono central -->
          <polygon points="0,-7 7,-2 4,6 -4,6 -7,-2" fill="#0c1d42" />
          <!-- Gomos laterais -->
          <path d="M 0,-7 L 0,-26" stroke="#0c1d42" stroke-width="3" />
          <path d="M 7,-2 L 23,-8" stroke="#0c1d42" stroke-width="3" />
          <path d="M 4,6 L 16,21" stroke="#0c1d42" stroke-width="3" />
          <path d="M -4,6 L -16,21" stroke="#0c1d42" stroke-width="3" />
          <path d="M -7,-2 L -23,-8" stroke="#0c1d42" stroke-width="3" />
          <!-- Outer small pentagons -->
          <polygon points="0,-26 5,-21 -5,-21" fill="#0c1d42" />
          <polygon points="23,-8 25,-1 19,-4" fill="#0c1d42" />
          <polygon points="16,21 21,17 14,14" fill="#0c1d42" />
          <polygon points="-16,21 -21,17 -14,14" fill="#0c1d42" />
          <polygon points="-23,-8 -25,-1 -19,-4" fill="#0c1d42" />
        </g>
      </g>
    </g>

    <!-- Central Curved Red Plaque Banner: "SIDERAL F.C." with Shadow -->
    <g filter="url(#bannerShadow)">
      <!-- Banner Outline / Bevel -->
      <path d="M 42,158 L 458,158 C 472,158 478,172 472,186 L 460,218 C 456,228 444,234 432,234 L 68,234 C 56,234 44,228 40,218 L 28,186 C 22,172 28,158 42,158 Z"
            fill="url(#bannerBorder)" />

      <!-- Banner Main Red Body -->
      <path d="M 46,162 L 454,162 C 464,162 470,173 465,183 L 454,213 C 451,222 441,228 430,228 L 70,228 C 59,228 49,222 46,213 L 35,183 C 30,173 36,162 46,162 Z"
            fill="url(#bannerRed)" />

      <!-- Top Highlight Line on Banner -->
      <line x1="56" y1="166" x2="444" y2="166" stroke="#ff8289" stroke-width="2.5" stroke-linecap="round" />

      <!-- SIDERAL F.C. 3D Text -->
      <!-- Dark Drop Shadow for 3D effect -->
      <text x="252" y="214"
            font-family="'Impact', 'Arial Black', sans-serif"
            font-size="54"
            font-weight="900"
            letter-spacing="2"
            text-anchor="middle"
            fill="#3a0205">SIDERAL F.C.</text>

      <!-- Main Embossed Metallic Text with stroke -->
      <text x="250" y="211"
            font-family="'Impact', 'Arial Black', sans-serif"
            font-size="54"
            font-weight="900"
            letter-spacing="2"
            text-anchor="middle"
            fill="url(#metalText)"
            stroke="#1c3563"
            stroke-width="2">SIDERAL F.C.</text>
    </g>
  </g>
</svg>
